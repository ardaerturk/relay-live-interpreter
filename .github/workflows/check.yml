name: Verify Relay
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: Standard macOS runner for the iPhone build and simulator
        type: choice
        options: [macos-26, macos-26-intel]
        default: macos-26
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci && npm test && npm run build
  iphone:
    runs-on: ${{ inputs.mac_runner || 'macos-26' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Build for a physical iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -project ios/Relay.xcodeproj -scheme Relay -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Relay" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/iphone-build.log" | tail -80
          test "$(/usr/libexec/PlistBuddy -c 'Print UIBackgroundModes:0' "$RUNNER_TEMP/Relay/Build/Products/Debug-iphoneos/Relay.app/Info.plist")" = audio
      - name: Launch and test the app in iPhone Simulator
        run: |
          set -eo pipefail
          xcodebuild -showdestinations -project ios/Relay.xcodeproj -scheme Relay > "$RUNNER_TEMP/destinations.txt"
          phone=$(python3 -c 'import re,sys;s=open(sys.argv[1]).read().split("Ineligible destinations")[0];print(next(re.search(r"id:([A-Fa-f0-9-]{36})",x)[1] for x in s.splitlines() if "platform:iOS Simulator" in x and "name:iPhone" in x and re.search(r"id:[A-Fa-f0-9-]{36}",x)))' "$RUNNER_TEMP/destinations.txt")
          xcodebuild -project ios/Relay.xcodeproj -scheme Relay -destination "platform=iOS Simulator,id=$phone" -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/Relay" -resultBundlePath "$RUNNER_TEMP/RelayTests.xcresult" test | tee "$RUNNER_TEMP/simulator.log" | tail -100
      - name: Export native appearance checks
        run: xcrun xcresulttool export attachments --test-id 'ContinuityTests/testNativeSessionAppearance()' --path "$RUNNER_TEMP/RelayTests.xcresult" --output-path "$RUNNER_TEMP/RelayAppearance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-appearance
          path: ${{ runner.temp }}/RelayAppearance
          retention-days: 7
